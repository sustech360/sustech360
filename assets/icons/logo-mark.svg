<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="S360">
  <!-- A full turn, drawn as two arcs that do not quite meet: the cycle is the
       subject, the gap is where the next issue goes. The rising stroke through
       the middle is an S and a measurement at once. -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#1F6F5C" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="118 45" transform="rotate(-125 32 32)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#7FBFAC" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="26 137" transform="rotate(66 32 32)"/>
  <path d="M40 23c-3.6-2.4-8.1-2.6-11.2-.6-3.6 2.4-3.6 7 .3 9.1 2 1.1 4.6 1.4 6.7 2.4 4.2 2 4.4 7 .5 9.5-3.2 2-7.8 1.7-11.3-.7"
        fill="none" stroke="#13212E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="6" r="4" fill="#1F6F5C"/>
</svg>
