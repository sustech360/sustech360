<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex, nofollow">
<title>Control centre — SusTech360</title>
<link rel="icon" href="../assets/icons/logo-mark.svg">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Sign in -->
<div id="login" class="signin">
  <div class="signin__card">
    <div class="signin__brand">
      <img src="../assets/icons/logo-mark.svg" alt="" width="40" height="40">
      <div>
        <strong>Control centre</strong>
        <span>Sustainable Science, Technology and Solutions 360</span>
      </div>
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <label for="mfa">Authentication code <span class="hint">if enabled</span></label>
    <input id="mfa" inputmode="numeric" autocomplete="one-time-code">
    <div class="rowbtns"><button class="act" id="signin" type="button">Sign in</button></div>
    <div id="loginmsg"></div>
  </div>
</div>

<!-- The tool -->
<div id="app" class="app hidden">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__head">
      <img src="../assets/icons/logo-mark.svg" alt="" width="26" height="26">
      <div class="sidebar__title">
        <strong>Control centre</strong>
        <span class="env" id="env"></span>
      </div>
      <button class="iconbtn sidebar__close" id="navclose" type="button" aria-label="Close menu">&times;</button>
    </div>

    <div class="sidebar__search">
      <input id="navsearch" type="search" placeholder="Search screens&hellip;" aria-label="Search screens"
             autocomplete="off" spellcheck="false">
      <kbd>Ctrl K</kbd>
    </div>

    <nav id="nav" aria-label="Sections"></nav>

    <div class="sidebar__foot">
      <div class="who" id="who"></div>
      <button class="ghost" id="signout" type="button">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="iconbtn topbar__menu" id="navopen" type="button" aria-label="Open menu">&#9776;</button>
      <h1 id="viewtitle">Dashboard</h1>
      <div class="topbar__right">
        <a class="ghost" href="../" target="_blank" rel="noopener">View the site</a>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
</div>

<script src="config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="editorial.js"></script>
<script src="rulebook.js"></script>
<script src="siteadmin.js"></script>
<script src="ads-admin.js"></script>
<script src="comms.js"></script>
<script src="issues-admin.js"></script>
<script src="performance.js"></script>
<script src="billing.js"></script>
<script src="admin.js"></script>
</body>
</html>
